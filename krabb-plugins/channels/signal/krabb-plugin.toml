id = "signal"
version = "0.1.0-rc.3"
capabilities = ["channel"]
permissions = ["process", "filesystem"]
secrets = ["KRABB_SIGNAL_ACCOUNT"]
check = true

[protocol]
major = 0
minor = 2

[setup.KRABB_SIGNAL_ACCOUNT]
label = "Bot account"
help = "The linked bot account's phone number with + and country code, or its account ID."
example = "+15551234567"
required = true

[[requires]]
program = "signal-cli"
setting = "KRABB_SIGNAL_COMMAND"
help = "Install signal-cli from https://github.com/AsamK/signal-cli#installation."
