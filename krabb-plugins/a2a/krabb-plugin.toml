id = "a2a"
version = "0.1.0-rc.4"
capabilities = ["agent"]
permissions = ["network"]
secrets = ["KRABB_A2A_TOKEN"]

[[commands]]
name = "a2a"
description = "Discover and collaborate with a remote A2A agent."
interactive = false

[protocol]
major = 0
minor = 2

[setup.KRABB_A2A_TOKEN]
label = "Bearer token"
help = "Only if the remote agent requires one, and it is sent only to the agent card's origin."
