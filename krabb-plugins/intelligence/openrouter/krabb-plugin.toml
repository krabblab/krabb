id = "openrouter"
version = "0.1.0-rc.3"
capabilities = ["model", "vision", "context"]
permissions = ["network"]
secrets = ["KRABB_OPENROUTER_KEY"]
check = true

[protocol]
major = 0
minor = 2

[setup.KRABB_OPENROUTER_KEY]
label = "API key"
help = "Create a key in your OpenRouter settings and paste it here."
url = "https://openrouter.ai/settings/keys"
example = "sk-or-..."
required = true
