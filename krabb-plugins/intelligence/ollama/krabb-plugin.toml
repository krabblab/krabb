id = "ollama"
version = "0.1.0"
capabilities = ["model", "vision", "context"]
permissions = ["network"]
secrets = ["KRABB_OLLAMA_API_KEY"]

[[settings]]
name = "KRABB_OLLAMA_HOST"
default = "https://ollama.com"

[[settings]]
name = "KRABB_OLLAMA_THINK"
default = "false"

[[settings]]
name = "KRABB_OLLAMA_CONTEXT_LENGTH"
default = "auto"

[protocol]
major = 0
minor = 1
