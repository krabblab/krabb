[package]
name = "krabb-plugin-local"
version = "0.1.0-rc.1"
edition = "2024"
rust-version.workspace = true
license = "Apache-2.0"
publish = false

[dependencies]
krabb-http.workspace = true
krabb-openai.workspace = true
krabb-log.workspace = true
krabb-core = { path = "../../../krabb-core" }
krabb-file = { path = "../../../krabb-libs/file" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "io-std", "fs", "net", "process", "signal", "sync", "time"] }

[dev-dependencies]
krabb-test.workspace = true
