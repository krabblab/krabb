id = "codex"
version = "0.1.0-rc.3"
capabilities = ["model", "vision", "context"]
permissions = ["network"]
check = true

[[settings]]
name = "KRABB_CODEX_CONTEXT_LENGTH"
default = "auto"

[[requires]]
program = "codex"
setting = "KRABB_CODEX_BINARY"
help = "Install the Codex CLI from https://developers.openai.com/codex/cli, then run `krabb service install --force`."

[[commands]]
name = "codex"
description = "Manage Codex sign-in and list available models."
interactive = false

[protocol]
major = 0
minor = 2

[setup.KRABB_CODEX_CONTEXT_LENGTH]
label = "Context length"
help = "Tokens of context for your deployment, or auto to use the model catalog."
kind = "integer"
accept = ["auto"]
