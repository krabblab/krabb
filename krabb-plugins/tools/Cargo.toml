[package]
name = "krabb-plugin-tools"
version = "0.1.0-rc.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
krabb-log.workspace = true
krabb-file = { path = "../../krabb-libs/file" }
krabb-core = { path = "../../krabb-core" }
krabb-process = { path = "../../krabb-libs/process" }
reqwest.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", default-features = false, features = ["fs", "process", "std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
