id = "ag-ui"
version = "0.1.0-rc.1"
capabilities = ["agent"]
permissions = ["network"]
secrets = ["KRABB_AG_UI_TOKEN"]

[[commands]]
name = "ag-ui"
description = "Serve the AG-UI run endpoint for local agent clients."
interactive = false

[protocol]
major = 0
minor = 1

[setup.KRABB_AG_UI_TOKEN]
label = "Client token"
help = "A random secret of at least 32 characters that local AG-UI clients must send."
required = true
