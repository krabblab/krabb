name: Install
run-name: >-
  ${{ format('test(install): drill installers on {0}', github.ref_name) }}

# Builds Krabb from the commit this run is on, installs it the way the README does, with the
# installers this run packaged for the release, and walks the first-run flow on every target.
# Choose the branch or tag under "Use workflow from" to test another commit. Plugins are
# installed but not set up, because setup needs third-party accounts; they come from the
# published index, or from a local index when the release directory also holds plugin
# archives. Release runs it on the archives it is about to publish, so a release whose
# installation does not work is never published. The steps live in krabb-scripts/drills.

on:
  workflow_dispatch:

  schedule:
    - cron: "41 5 * * 1"

  workflow_call:
    inputs:
      artifact:
        description: "Prefix of release directories already packaged in this run"
        required: true
        type: string

      targets:
        description: "The release targets as a JSON array"
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Package
    if: inputs.artifact == ''
    uses: ./.github/workflows/package.yml

    with:
      names: core
      artifact: krabb-install

  flow:
    name: Flow (${{ matrix.name }})
    needs: package
    if: ${{ !cancelled() && needs.package.result != 'failure' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    strategy:
      fail-fast: false

      matrix:
        include: ${{ fromJSON(inputs.targets || needs.package.outputs.targets) }}

    defaults:
      run:
        shell: ${{ matrix.os == 'windows' && 'pwsh' || 'bash' }}

    env:
      KRABB_ARCHIVE: ${{ matrix.archive }}
      KRABB_TARGET: ${{ matrix.target }}

      KRABB_DRILL: >-
        ${{ matrix.os == 'windows' && './krabb-scripts/drills/drill.ps1' ||
            'bash krabb-scripts/drills/drill.sh' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

        with:
          persist-credentials: false

      - name: Download Release
        uses: actions/download-artifact@v8

        with:
          name: ${{ inputs.artifact || 'krabb-install' }}-${{ matrix.target }}
          path: ${{ runner.temp }}/release

      - name: Download Installers
        uses: actions/download-artifact@v8

        with:
          name: ${{ inputs.artifact || 'krabb-install' }}-installers
          path: ${{ runner.temp }}/installers

      - name: Serve The Release And Its Plugins
        shell: bash
        run: bash krabb-scripts/drills/drill.sh install-serve

      - name: Isolate Home
        run: ${{ env.KRABB_DRILL }} install-home

      - name: Install With ${{ matrix.os == 'windows' && 'install.ps1' || 'install.sh' }}
        run: ${{ env.KRABB_DRILL }} install

      - name: Check Version
        run: ${{ env.KRABB_DRILL }} version

      - name: Initialize Home
        run: ${{ env.KRABB_DRILL }} init

      - name: Run Doctor
        run: ${{ env.KRABB_DRILL }} doctor

      - name: Show Status
        run: ${{ env.KRABB_DRILL }} status

      - name: Install Official Plugins
        run: ${{ env.KRABB_DRILL }} plugins

      - name: Check Plugin Health
        run: ${{ env.KRABB_DRILL }} health

      - name: Start, Stop, And Restart The Daemon
        run: ${{ env.KRABB_DRILL }} daemon

      - name: Run Krabb As A Service
        run: ${{ env.KRABB_DRILL }} service

      - name: Uninstall And Purge
        run: ${{ env.KRABB_DRILL }} uninstall
