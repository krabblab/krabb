name: Install

# Builds Krabb from the commit this run is on, installs it the way the README does, and walks
# the first-run flow on every target. Choose the branch or tag under "Use workflow from" to
# test another commit. Plugins come from the published index and are installed but not set
# up, because setup needs third-party accounts. Release runs it on the archives it is about to
# publish, so a release whose installation does not work is never published.

on:
  workflow_dispatch:

  schedule:
    - cron: "41 5 * * 1"

  workflow_call:
    inputs:
      artifact:
        description: "Prefix of core archives already packaged in this run"
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Package
    if: inputs.artifact == ''
    uses: ./.github/workflows/package.yml

    with:
      names: core
      artifact: krabb-install

  flow:
    name: Flow (${{ matrix.name }})
    needs: package
    if: ${{ !cancelled() && needs.package.result != 'failure' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: Linux x86_64
            os: linux
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz

          - name: Linux aarch64
            os: linux
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz

          - name: macOS x86_64
            os: macos
            runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz

          - name: macOS aarch64
            os: macos
            runner: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz

          - name: Windows x86_64
            os: windows
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            archive: zip

          - name: Windows aarch64
            os: windows
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v7

        with:
          persist-credentials: false

      - if: matrix.os != 'windows'
        name: List Official Plugins
        shell: bash

        run: |
          set -euo pipefail
          plugins=$(python3 krabb-scripts/plugins.py ids ghcr.io/krabblab/krabb/plugins)
          echo "KRABB_PLUGINS=$plugins" >> "$GITHUB_ENV"

      - if: matrix.os == 'windows'
        name: List Official Plugins
        shell: pwsh

        run: |
          $plugins = python krabb-scripts/plugins.py ids ghcr.io/krabblab/krabb/plugins
          if ($LASTEXITCODE -ne 0) { throw "Listing the official plugins failed." }
          "KRABB_PLUGINS=$plugins" >> $env:GITHUB_ENV

      - name: Download Archive
        uses: actions/download-artifact@v8

        with:
          name: ${{ inputs.artifact || 'krabb-install' }}-${{ matrix.target }}
          path: ${{ runner.temp }}/release

      - name: Serve The Archive Locally
        shell: bash

        env:
          KRABB_TARGET: ${{ matrix.target }}
          KRABB_ARCHIVE: ${{ matrix.archive }}

        run: |
          set -euo pipefail
          version=$(bash krabb-scripts/version.sh)
          release="$RUNNER_TEMP/release"
          archive="krabb-core-v$version-$KRABB_TARGET.$KRABB_ARCHIVE"

          test -f "$release/$archive"

          cd "$release"

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > SHA256SUMS
          else
            shasum -a 256 "$archive" > SHA256SUMS
          fi

          cd "$GITHUB_WORKSPACE"

          unstable=false
          case "$version" in *-*) unstable=true ;; esac

          {
            echo "KRABB_EXPECTED=$version"
            echo "KRABB_VERSION=$version"
            echo "KRABB_UNSTABLE=$unstable"
          } >> "$GITHUB_ENV"

      - if: matrix.os != 'windows'
        name: Isolate Home
        shell: bash

        run: |
          set -euo pipefail
          user="$RUNNER_TEMP/user"
          mkdir -p "$user"

          {
            echo "KRABB_RUNNER_HOME=$HOME"
            echo "HOME=$user"
            echo "XDG_CONFIG_HOME=$user/.config"
            echo "KRABB_HOME=$user/.krabb"
            echo "KRABB_PREFIX=$user/.local"
            echo "KRABB_RELEASE_BASE=file://$RUNNER_TEMP/release"
          } >> "$GITHUB_ENV"

          echo "$user/.local/bin" >> "$GITHUB_PATH"

      - if: matrix.os != 'windows'
        name: Install With install.sh
        shell: bash
        run: sh install.sh

      - if: matrix.os != 'windows'
        name: Check Version
        shell: bash
        run: test "$(krabb version)" = "krabb $KRABB_EXPECTED"

      - if: matrix.os != 'windows'
        name: Initialize Home
        shell: bash
        run: krabb --json init < /dev/null

      - if: matrix.os != 'windows'
        name: Run Doctor
        shell: bash
        run: krabb --json doctor < /dev/null

      - if: matrix.os != 'windows'
        name: Show Status
        shell: bash
        run: krabb --json status < /dev/null

      - if: matrix.os != 'windows'
        name: Install Official Plugins
        shell: bash

        run: |
          set -euo pipefail
          flags=(--yes)
          [ "$KRABB_UNSTABLE" = true ] && flags+=(--unstable)
          failed=()

          for id in $(jq -r '.[]' <<<"$KRABB_PLUGINS"); do
            if ! krabb plugin install "$id" "${flags[@]}" < /dev/null; then
              failed+=("$id")
            fi
          done

          installed=$(krabb --json plugin list | jq -r '.items[].id')

          for id in $(jq -r '.[]' <<<"$KRABB_PLUGINS"); do
            grep -qx "$id" <<<"$installed" || failed+=("$id (not listed)")
          done

          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::Plugins that did not install: ${failed[*]}"
            exit 1
          fi

      - if: matrix.os != 'windows'
        name: Check Plugin Health
        shell: bash

        run: |
          set -euo pipefail
          krabb --json doctor < /dev/null > /dev/null
          unhealthy=$(krabb --json plugin list | jq -r '.items[] | select(.health != "ready") | .id')

          if [ -n "$unhealthy" ]; then
            echo "::error::Plugins that are not healthy: $(echo $unhealthy)"
            exit 1
          fi

      - if: matrix.os != 'windows'
        name: Start, Stop, And Restart The Daemon
        shell: bash

        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/daemon.log"

          until_daemon() {
            for _ in $(seq 1 60); do
              [ "$(krabb --json status < /dev/null | jq -r .daemon)" = "$1" ] && return 0
              sleep 1
            done

            echo "::error::The daemon did not become $1."
            cat "$log"
            return 1
          }

          krabb-daemon >> "$log" 2>&1 &
          pid=$!
          until_daemon running
          krabb --json session new install-flow < /dev/null > /dev/null

          kill "$pid"
          wait "$pid" || true
          until_daemon stopped

          krabb-daemon >> "$log" 2>&1 &
          pid=$!
          until_daemon running

          if ! krabb --json session list < /dev/null | jq -e '.items[] | select(.id == "install-flow")' > /dev/null; then
            echo "::error::The session did not survive the restart."
            exit 1
          fi

          kill "$pid"
          wait "$pid" || true

      - if: matrix.os != 'windows'
        name: Run Krabb As A Service
        shell: bash

        run: |
          set -euo pipefail

          # systemd reads user units from the runner's own home and needs a user session, so
          # Linux keeps Krabb's home isolated but uses the runner's systemd user manager.
          if [ "$RUNNER_OS" = Linux ]; then
            sudo loginctl enable-linger "$(id -un)"
            export XDG_RUNTIME_DIR="/run/user/$(id -u)"
            export XDG_CONFIG_HOME="$KRABB_RUNNER_HOME/.config"

            for _ in $(seq 1 30); do
              systemctl --user is-system-running > /dev/null 2>&1 && break
              [ "$(systemctl --user is-system-running 2>/dev/null)" = degraded ] && break
              sleep 1
            done
          fi

          until_daemon() {
            for _ in $(seq 1 60); do
              [ "$(krabb --json status < /dev/null | jq -r .daemon)" = "$1" ] && return 0
              sleep 1
            done

            echo "::error::The service did not leave the daemon $1."
            tail -n 40 "$KRABB_HOME"/logs/*.log || true
            return 1
          }

          path=$(krabb --json service install | jq -r .path)
          test -f "$path"
          test "$(krabb --json service status | jq -r .status)" = installed

          krabb service start
          until_daemon running
          krabb --json session new service-flow < /dev/null > /dev/null

          krabb service restart
          until_daemon running

          if ! krabb --json session list < /dev/null | jq -e '.items[] | select(.id == "service-flow")' > /dev/null; then
            echo "::error::The session did not survive the service restart."
            exit 1
          fi

          krabb service stop
          until_daemon stopped
          krabb service uninstall --yes
          test ! -e "$path"

      - if: matrix.os != 'windows'
        name: Uninstall And Purge
        shell: bash

        run: |
          set -euo pipefail

          # The service step runs the unit under the runner's own systemd user manager.
          if [ "$RUNNER_OS" = Linux ]; then
            export XDG_RUNTIME_DIR="/run/user/$(id -u)"
            export XDG_CONFIG_HOME="$KRABB_RUNNER_HOME/.config"
          fi

          krabb --json service install > /dev/null
          krabb service start
          sh uninstall.sh

          if [ "$RUNNER_OS" = Linux ] && systemctl --user is-active --quiet krabb.service; then
            echo "::error::Uninstall left the service running."
            exit 1
          fi

          for path in "$KRABB_PREFIX/bin/krabb" "$KRABB_PREFIX/bin/krabb-daemon"; do
            if [ -e "$path" ]; then echo "::error::Uninstall left $path."; exit 1; fi
          done

          test -f "$KRABB_HOME/config.toml"
          test -d "$KRABB_HOME/plugins"
          sh uninstall.sh --purge --yes

          left=$(find "$HOME" "$KRABB_RUNNER_HOME/.config/systemd" -iname '*krabb*' 2>/dev/null || true)
          if [ -n "$left" ]; then echo "::error::Purge left: $left"; exit 1; fi

      - if: matrix.os == 'windows'
        name: Isolate Home
        shell: pwsh

        run: |
          $ErrorActionPreference = "Stop"
          $user = Join-Path $env:RUNNER_TEMP "user"
          $release = Join-Path $env:RUNNER_TEMP "release"
          New-Item -ItemType Directory -Force -Path $user | Out-Null
          "USERPROFILE=$user" >> $env:GITHUB_ENV
          "HOME=$user" >> $env:GITHUB_ENV
          "LOCALAPPDATA=$user\AppData\Local" >> $env:GITHUB_ENV
          "KRABB_HOME=$user\.krabb" >> $env:GITHUB_ENV
          "KRABB_RELEASE_BASE=$(([Uri]$release).AbsoluteUri.TrimEnd('/'))" >> $env:GITHUB_ENV
          "$user\AppData\Local\Krabb\bin" >> $env:GITHUB_PATH

      - if: matrix.os == 'windows'
        name: Install With install.ps1
        shell: pwsh

        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null

          # The installer runs no native command, so only its own `exit` sets this.
          $global:LASTEXITCODE = 0
          & "$env:GITHUB_WORKSPACE/install.ps1"
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 failed." }

      - if: matrix.os == 'windows'
        name: Check Version
        shell: pwsh

        run: |
          $reported = krabb version
          if ($reported -ne "krabb $env:KRABB_EXPECTED") { throw "Installed CLI reports '$reported'." }

      - if: matrix.os == 'windows'
        name: Initialize Home
        shell: pwsh

        run: |
          krabb --json init
          if ($LASTEXITCODE -ne 0) { throw "krabb init failed." }

      - if: matrix.os == 'windows'
        name: Run Doctor
        shell: pwsh

        run: |
          krabb --json doctor
          if ($LASTEXITCODE -ne 0) { throw "krabb doctor failed." }

      - if: matrix.os == 'windows'
        name: Show Status
        shell: pwsh

        run: |
          krabb --json status
          if ($LASTEXITCODE -ne 0) { throw "krabb status failed." }

      - if: matrix.os == 'windows'
        name: Install Official Plugins
        shell: pwsh

        run: |
          $flags = @("--yes")
          if ($env:KRABB_UNSTABLE -eq "true") { $flags += "--unstable" }
          $plugins = $env:KRABB_PLUGINS | ConvertFrom-Json
          $failed = @()

          foreach ($id in $plugins) {
            krabb plugin install $id @flags
            if ($LASTEXITCODE -ne 0) { $failed += $id }
          }

          $listed = krabb --json plugin list
          if ($LASTEXITCODE -ne 0) { throw "krabb plugin list failed." }
          $installed = ($listed | Out-String | ConvertFrom-Json).items.id

          foreach ($id in $plugins) {
            if ($installed -notcontains $id) { $failed += "$id (not listed)" }
          }

          if ($failed.Count -gt 0) {
            Write-Output "::error::Plugins that did not install: $($failed -join ', ')"
            exit 1
          }

      - if: matrix.os == 'windows'
        name: Check Plugin Health
        shell: pwsh

        run: |
          krabb --json doctor | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "krabb doctor failed after installing plugins." }

          $listed = krabb --json plugin list
          if ($LASTEXITCODE -ne 0) { throw "krabb plugin list failed." }
          $unhealthy = @(($listed | Out-String | ConvertFrom-Json).items | Where-Object { $_.health -ne "ready" })

          if ($unhealthy.Count -gt 0) {
            Write-Output "::error::Plugins that are not healthy: $($unhealthy.id -join ', ')"
            exit 1
          }

      - if: matrix.os == 'windows'
        name: Start, Stop, And Restart The Daemon
        shell: pwsh

        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:RUNNER_TEMP "daemon.out"
          $err = Join-Path $env:RUNNER_TEMP "daemon.err"

          function Wait-Daemon([string] $State) {
            for ($i = 0; $i -lt 60; $i++) {
              $reported = (krabb --json status | Out-String | ConvertFrom-Json).daemon
              if ($reported -eq $State) { return }
              Start-Sleep -Seconds 1
            }

            Get-Content $out, $err -ErrorAction SilentlyContinue
            throw "The daemon did not become $State."
          }

          function Start-Daemon {
            Start-Process krabb-daemon -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError $err
          }

          $daemon = Start-Daemon
          Wait-Daemon "running"
          krabb --json session new install-flow | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "krabb session new failed." }

          Stop-Process -Id $daemon.Id
          $daemon.WaitForExit()
          Wait-Daemon "stopped"

          $daemon = Start-Daemon
          Wait-Daemon "running"
          $listed = krabb --json session list
          if ($LASTEXITCODE -ne 0) { throw "krabb session list failed." }
          $ids = ($listed | Out-String | ConvertFrom-Json).items.id
          if ($ids -notcontains "install-flow") { throw "The session did not survive the restart." }

          Stop-Process -Id $daemon.Id
          $daemon.WaitForExit()

      - if: matrix.os == 'windows'
        name: Run Krabb As A Service
        shell: pwsh

        run: |
          $ErrorActionPreference = "Stop"

          function Invoke-Krabb {
            $output = krabb @args
            if ($LASTEXITCODE -ne 0) { throw "krabb $args failed: $output" }
            return ($output | Out-String | ConvertFrom-Json)
          }

          function Wait-Daemon([string] $State) {
            for ($i = 0; $i -lt 60; $i++) {
              if ((Invoke-Krabb --json status).daemon -eq $State) { return }
              Start-Sleep -Seconds 1
            }

            Get-ChildItem (Join-Path $env:KRABB_HOME "logs") -Filter *.log -ErrorAction SilentlyContinue |
              ForEach-Object { Get-Content $_.FullName -Tail 40 }
            throw "The service did not leave the daemon $State."
          }

          $installed = Invoke-Krabb --json service install

          try {
            if (!(Test-Path $installed.path)) { throw "Service definition is missing at $($installed.path)." }

            $status = Invoke-Krabb --json service status
            if ($status.status -ne "installed") { throw "Service status reported '$($status.status)'." }

            krabb service start
            if ($LASTEXITCODE -ne 0) { throw "krabb service start failed." }
            Wait-Daemon "running"
            Invoke-Krabb --json session new service-flow | Out-Null

            krabb service restart
            if ($LASTEXITCODE -ne 0) { throw "krabb service restart failed." }
            Wait-Daemon "running"

            $ids = (Invoke-Krabb --json session list).items.id
            if ($ids -notcontains "service-flow") { throw "The session did not survive the service restart." }

            krabb service stop
            if ($LASTEXITCODE -ne 0) { throw "krabb service stop failed." }
            Wait-Daemon "stopped"
          } catch {
            # Name the owner of every state file, since access to them is what fails here.
            Get-ChildItem $env:KRABB_HOME -Recurse -File -ErrorAction SilentlyContinue |
              Select-Object -First 60 |
              ForEach-Object { "{0}  {1}" -f (Get-Acl $_.FullName).Owner, $_.FullName }
            throw
          } finally {
            krabb service uninstall --yes
            if ($LASTEXITCODE -ne 0) { throw "krabb service uninstall failed." }
          }

          if (Test-Path $installed.path) { throw "Service definition remains at $($installed.path)." }
          if (Get-Service -Name Krabb -ErrorAction SilentlyContinue) { throw "Windows still has the Krabb service." }

      - if: matrix.os == 'windows'
        name: Uninstall And Purge
        shell: pwsh

        run: |
          $ErrorActionPreference = "Stop"
          $bin = Join-Path $env:LOCALAPPDATA "Krabb\bin"

          krabb --json service install | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "krabb service install failed." }

          pwsh -NoProfile -File .\uninstall.ps1
          if ($LASTEXITCODE -ne 0) { throw "uninstall.ps1 failed." }
          if (Get-Service -Name Krabb -ErrorAction SilentlyContinue) { throw "Uninstall left the Krabb service." }

          foreach ($path in "$bin\krabb.exe", "$bin\krabb-daemon.exe") {
            if (Test-Path $path) { throw "Uninstall left $path." }
          }

          if (!(Test-Path "$env:KRABB_HOME\config.toml")) { throw "Uninstall removed the configuration." }
          if (!(Test-Path "$env:KRABB_HOME\plugins")) { throw "Uninstall removed the plugins." }
          $path = [Environment]::GetEnvironmentVariable("Path", "User")
          if (($path -split ";") -contains $bin) { throw "Uninstall left $bin in the user PATH." }

          pwsh -NoProfile -File .\uninstall.ps1 -Purge -Yes
          if ($LASTEXITCODE -ne 0) { throw "uninstall.ps1 -Purge failed." }

          $left = @(Get-ChildItem $env:USERPROFILE -Recurse -Force -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like "*krabb*" })
          if ($left.Count -gt 0) { throw "Purge left: $($left.FullName -join ', ')" }
          if (Get-Service -Name Krabb -ErrorAction SilentlyContinue) { throw "Purge left the Krabb service." }
