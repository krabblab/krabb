name: Check

on:
  workflow_dispatch:
    inputs:
      container_image:
        description: "Optional local CI container image"
        required: false
        type: string
        default: ""

      local:
        description: "Use the local act working tree"
        required: false
        type: string
        default: ""

  workflow_call:
    inputs:
      container_image:
        required: false
        type: string
        default: ""

      cargo:
        description: "Cargo package selection: -p flags, or --workspace"
        required: false
        type: string
        default: "--workspace"

      base:
        description: "Revision to compare with, so formatting checks only changed files"
        required: false
        type: string
        default: ""

      local:
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0

jobs:
  workspace:
    name: Workspace
    runs-on: ubuntu-latest
    container: ${{ inputs.container_image || 'rust:1.96-trixie' }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        if: inputs.local != 'true'
        uses: actions/checkout@v7

      - name: Install Metrics Tools
        if: inputs.local != 'true'
        run: |
          apt-get update
          apt-get install --no-install-recommends -y ripgrep python3

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

        with:
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Install Rust Components
        run: rustup component add clippy

      # The container's toolchain is the minimum supported Rust version, so Clippy also
      # proves that the selected packages build with it.
      - name: Run Clippy
        env:
          SELECTION: ${{ inputs.cargo || '--workspace' }}

        run: CARGO_BUILD_JOBS=4 cargo clippy $SELECTION --all-targets --locked -- -D warnings

      - name: Check Documentation
        env:
          SELECTION: ${{ inputs.cargo || '--workspace' }}

        run: RUSTDOCFLAGS='-D warnings' cargo doc $SELECTION --no-deps --locked

      - name: Report Metrics
        run: bash krabb-scripts/metrics.sh

  format:
    name: Format
    runs-on: ubuntu-latest
    container: ${{ inputs.container_image || 'rust:1.96-trixie' }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        if: inputs.local != 'true'
        uses: actions/checkout@v7

        with:
          fetch-depth: 2

      - name: Install Spacing Tools
        if: inputs.local != 'true'
        run: |
          apt-get update
          apt-get install --no-install-recommends -y python3

      - name: Install Rust Components
        run: rustup component add rustfmt

      # The container runs as root on a checkout the runner owns, so Git needs this to read it.
      - name: Check Formatting
        env:
          BASE: ${{ inputs.base }}

        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cargo fmt --all --check
          bash krabb-scripts/spacing.sh --check ${BASE:+--changed "$BASE"}

  loops:
    name: Loops
    runs-on: ubuntu-latest
    container: ${{ inputs.container_image || 'rust:1.96-trixie' }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        if: inputs.local != 'true'
        uses: actions/checkout@v7

      - name: Install Loop Tools
        if: inputs.local != 'true'
        run: |
          apt-get update
          apt-get install --no-install-recommends -y python3

      - name: Check Shell Scripts and Engineering Loops
        run: make loops

  windows_gnu:
    name: Windows GNU
    runs-on: ubuntu-latest
    container: ${{ inputs.container_image || 'rust:1.96-trixie' }}

    # Set for the whole job so the Cargo cache key includes it.
    env:
      RUSTFLAGS: -D warnings

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        if: inputs.local != 'true'
        uses: actions/checkout@v7

      - name: Install MinGW
        if: inputs.local != 'true'
        run: |
          apt-get update
          apt-get install --no-install-recommends -y gcc-mingw-w64-x86-64
          x86_64-w64-mingw32-gcc --version

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

        with:
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Check Windows GNU Target
        env:
          CARGO_BUILD_JOBS: 4
          SELECTION: ${{ inputs.cargo || '--workspace' }}

        run: |
          rustup target add x86_64-pc-windows-gnu
          cargo check $SELECTION --all-targets --target x86_64-pc-windows-gnu --locked
