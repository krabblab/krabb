name: Check

on:
  workflow_dispatch:
    inputs:
      container_image:
        description: "Optional local CI container image"
        required: false
        type: string
        default: ""

      local:
        description: "Use the local act working tree"
        required: false
        type: string
        default: ""

  workflow_call:
    inputs:
      container_image:
        required: false
        type: string
        default: ""

      local:
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0

jobs:
  workspace:
    name: Workspace
    runs-on: ubuntu-latest
    container: ${{ inputs.container_image || 'rust:1.89-trixie' }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        if: inputs.local != 'true'
        uses: actions/checkout@v7

      - name: Install Metrics Tools
        if: inputs.local != 'true'
        run: |
          apt-get update
          apt-get install --no-install-recommends -y ripgrep python3

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

        with:
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Install Rust Components
        run: rustup component add rustfmt clippy

      - name: Check Formatting
        run: |
          cargo fmt --all --check
          bash krabb-scripts/spacing.sh --check

      - name: Run Clippy
        run: CARGO_BUILD_JOBS=4 cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check Documentation
        run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps --locked

      - name: Check Shell Scripts and Engineering Loops
        run: make loops

      - name: Report Metrics
        run: bash krabb-scripts/metrics.sh

  msrv:
    name: Minimum Rust Version
    runs-on: ubuntu-latest
    container: ${{ inputs.container_image || 'rust:1.89-trixie' }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        if: inputs.local != 'true'
        uses: actions/checkout@v7

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

        with:
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Check Workspace
        run: CARGO_BUILD_JOBS=4 cargo check --workspace --all-targets --locked

  windows_gnu:
    name: Windows GNU
    runs-on: ubuntu-latest
    container: ${{ inputs.container_image || 'rust:1.89-trixie' }}

    # Set for the whole job so the Cargo cache key includes it.
    env:
      RUSTFLAGS: -D warnings

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        if: inputs.local != 'true'
        uses: actions/checkout@v7

      - name: Install MinGW
        if: inputs.local != 'true'
        run: |
          apt-get update
          apt-get install --no-install-recommends -y gcc-mingw-w64-x86-64
          x86_64-w64-mingw32-gcc --version

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

        with:
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Check Windows GNU Target

        run: |
          rustup target add x86_64-pc-windows-gnu
          cargo check --workspace --all-targets --target x86_64-pc-windows-gnu --locked

        env:
          CARGO_BUILD_JOBS: 4
