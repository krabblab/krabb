name: Plugins

# Publishes the plugin versions the Release workflow found unpublished, then rebuilds the
# registry's index from its tags. The index is rebuilt even when nothing is new, so a
# failed earlier run heals.

on:
  workflow_call:
    inputs:
      names:
        description: "Space-separated IDs of plugins to publish; may be empty."
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  package:
    name: Package
    if: inputs.names != ''
    uses: ./.github/workflows/package.yml

    with:
      names: ${{ inputs.names }}
      artifact: krabb-plugins-${{ github.run_id }}

  publish:
    name: Publish
    needs: package
    if: ${{ !cancelled() && needs.package.result != 'failure' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

        with:
          persist-credentials: false

      - name: Download Archives
        if: inputs.names != ''
        uses: actions/download-artifact@v8

        with:
          pattern: krabb-plugins-${{ github.run_id }}-*
          path: dist
          merge-multiple: true

      - name: Install ORAS
        uses: oras-project/setup-oras@v1

      - name: Sign In To The Registry
        env:
          GITHUB_TOKEN: ${{ github.token }}

        run: printf '%s' "$GITHUB_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Publish Plugins And The Index
        env:
          KRABB_REGISTRY_TOKEN: ${{ github.token }}
          KRABB_REGISTRY_USER: ${{ github.actor }}

        run: |
          set -euo pipefail
          mkdir -p dist
          python3 krabb-scripts/plugins.py publish dist \
            "ghcr.io/${GITHUB_REPOSITORY,,}/plugins" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
