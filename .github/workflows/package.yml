name: Package

on:
  workflow_call:
    inputs:
      names:
        description: "Space-separated core or plugin IDs; each archive uses its own version."
        required: true
        type: string

      artifact:
        description: "Upload name prefix; the target triple is appended."
        required: true
        type: string

      version:
        description: "Workspace version to build Krabb at instead of its own, for update tests."
        required: false
        type: string
        default: ""

    outputs:
      targets:
        description: "The release targets as a JSON array, for drill matrices."
        value: ${{ jobs.targets.outputs.targets }}

  workflow_dispatch:
    inputs:
      names:
        description: "Space-separated core or plugin IDs; each archive uses its own version."
        required: true
        type: string
        default: core

      artifact:
        description: "Upload name prefix; the target triple is appended."
        required: true
        type: string
        default: krabb-package

      version:
        description: "Workspace version to build Krabb at instead of its own, for update tests."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:

  # The six release targets are listed once, in krabb-scripts/targets.json.
  targets:
    name: Targets
    runs-on: ubuntu-latest

    outputs:
      targets: ${{ steps.targets.outputs.targets }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

        with:
          persist-credentials: false
          sparse-checkout: krabb-scripts/targets.json
          sparse-checkout-cone-mode: false

      - id: targets
        name: Read The Targets
        run: echo "targets=$(jq -c . krabb-scripts/targets.json)" >> "$GITHUB_OUTPUT"

  # The installers a release attaches, stamped with its version, and their SHA256SUMS lines.
  installers:
    name: Installers
    if: contains(format(' {0} ', inputs.names), ' core ')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

        with:
          persist-credentials: false

      - name: Write The Installers
        env:
          KRABB_VERSION: ${{ inputs.version }}

        run: |
          set -euo pipefail
          version=${KRABB_VERSION:-$(bash krabb-scripts/version.sh)}
          python3 krabb-scripts/installers.py "$version" "$RUNNER_TEMP/installers"
          (cd "$RUNNER_TEMP/installers" && sha256sum --check --strict SHA256SUMS)

      - name: Upload Installers
        uses: actions/upload-artifact@v7

        with:
          name: ${{ inputs.artifact }}-installers
          path: ${{ runner.temp }}/installers
          if-no-files-found: error

  archive:
    name: Archive (${{ matrix.name }})
    needs: targets
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    strategy:
      fail-fast: false

      matrix:
        include: ${{ fromJSON(needs.targets.outputs.targets) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

        with:
          persist-credentials: false

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@1.100

        with:
          targets: ${{ matrix.target }}

      # Cargo refreshes the workspace entries in Cargo.lock, so the locked build accepts it.
      - if: inputs.version != ''
        name: Override Workspace Version
        shell: bash

        env:
          KRABB_VERSION: ${{ inputs.version }}

        run: |
          set -euo pipefail

          if [[ ! "$KRABB_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version '$KRABB_VERSION' is not a valid release version."
            exit 1
          fi

          awk -v version="$KRABB_VERSION" '
            /^\[/ { section = $0 }
            section ~ /^\[workspace\.package\]/ && /^version = "/ { $0 = "version = \"" version "\"" }
            { print }
          ' Cargo.toml > Cargo.toml.new

          mv Cargo.toml.new Cargo.toml
          cargo metadata --format-version 1 > /dev/null
          test "$(bash krabb-scripts/version.sh)" = "$KRABB_VERSION"
          tr -d '\r' < Cargo.lock | grep -A1 -x 'name = "krabb"' |
            grep -qx "version = \"$KRABB_VERSION\""

      - if: matrix.archive == 'tar.gz'
        name: Build Unix Archives

        env:
          KRABB_NAMES: ${{ inputs.names }}
          KRABB_TARGET: ${{ matrix.target }}

        run: |
          set -euo pipefail
          read -ra names <<< "$KRABB_NAMES"
          bash krabb-scripts/package.sh "$KRABB_TARGET" "${names[@]}"

      - if: matrix.archive == 'zip'
        name: Build Windows Archives
        shell: pwsh

        env:
          KRABB_NAMES: ${{ inputs.names }}
          KRABB_TARGET: ${{ matrix.target }}

        run: |
          $ErrorActionPreference = "Stop"
          $target = $env:KRABB_TARGET
          $names = @($env:KRABB_NAMES -split '\s+' | Where-Object { $_ })
          $manifests = @{}
          $packages = @()

          foreach ($name in $names) {
            if ($name -notmatch '^[a-z0-9][a-z0-9-]*$') { throw "Name '$name' is not valid." }

            if ($name -eq "core") {
              $packages += @("-p", "krabb", "-p", "krabb-daemon")
            } else {
              $manifest = Get-ChildItem "krabb-plugins" -Recurse -Filter "krabb-plugin.toml" |
                Where-Object { (Get-Content $_.FullName) -contains "id = `"$name`"" } |
                Select-Object -First 1

              if (-not $manifest) { throw "Plugin manifest is missing: $name." }
              $manifests[$name] = $manifest.FullName
              $packages += @("-p", "krabb-plugin-$name")
            }
          }

          cargo build --release --locked --target "$target" @packages
          if ($LASTEXITCODE -ne 0) { throw "Build failed." }

          foreach ($name in $names) {
            if ($name -eq "core") {
              $binary = "krabb"
              $version = bash krabb-scripts/version.sh
              if ($LASTEXITCODE -ne 0 -or -not $version) { throw "Cargo.toml has no workspace version." }
            } else {
              $binary = "krabb-plugin-$name"
              $version = ((Get-Content $manifests[$name]) -match '^version = "' |
                Select-Object -First 1) -replace '^version = "(.*)"$', '$1'
            }

            $package = "krabb-$name-v$version-$target"
            New-Item -ItemType Directory -Force -Path "$package/bin" | Out-Null
            Copy-Item "target/$target/release/$binary.exe" "$package/bin/$binary.exe"

            if ($name -eq "core") {
              Copy-Item "target/$target/release/krabb-daemon.exe" "$package/bin/"
            } else {
              Copy-Item $manifests[$name] "$package/"
            }

            Copy-Item LICENSE, NOTICE "$package/"
            Compress-Archive -Path $package -DestinationPath "$package.zip" -Force
            Remove-Item -Recurse -Force $package
            Write-Output "Created $package.zip."
          }

      # Each target's line of the release's SHA256SUMS, which the drills install from.
      - if: contains(format(' {0} ', inputs.names), ' core ')
        name: Write Checksums
        shell: bash

        env:
          KRABB_ARCHIVE: ${{ matrix.archive }}
          KRABB_TARGET: ${{ matrix.target }}

        run: |
          set -euo pipefail
          archive="krabb-core-v$(bash krabb-scripts/version.sh)-$KRABB_TARGET.$KRABB_ARCHIVE"
          sum=$(sha256sum "$archive" 2>/dev/null || shasum -a 256 "$archive")
          printf '%s  %s\n' "${sum%% *}" "$archive" > SHA256SUMS

      - if: matrix.archive == 'tar.gz'
        name: Validate Unix Archives
        shell: bash

        env:
          KRABB_NAMES: ${{ inputs.names }}
          KRABB_TARGET: ${{ matrix.target }}
          KRABB_OS: ${{ matrix.os }}

        run: |
          set -euo pipefail
          read -ra names <<< "$KRABB_NAMES"
          archives=(krabb-*-"$KRABB_TARGET".tar.gz)
          [[ ${#archives[@]} -eq ${#names[@]} ]]
          stage=$(mktemp -d)

          for archive in "${archives[@]}"; do
            krabb-scripts/check.sh "$archive"
            name=${archive%.tar.gz}
            tar -xzf "$archive" -C "$stage"
            package="$stage/$name"
            [[ -f "$package/LICENSE" && -f "$package/NOTICE" ]]
            [[ -d "$package/bin" ]]

            if [[ "$name" == krabb-core-* ]]; then
              [[ -x "$package/bin/krabb" && -x "$package/bin/krabb-daemon" ]]
              "$package/bin/krabb" version
              smoke="$stage/service-smoke"
              mkdir -p "$smoke/home" "$smoke/config"

              HOME="$smoke/home" XDG_CONFIG_HOME="$smoke/config" KRABB_HOME="$smoke/home/krabb" \
                "$package/bin/krabb" service install

              HOME="$smoke/home" XDG_CONFIG_HOME="$smoke/config" KRABB_HOME="$smoke/home/krabb" \
                "$package/bin/krabb" service status

              case "$KRABB_OS" in
                linux) service="$smoke/config/systemd/user/krabb.service" ;;
                macos) service="$smoke/home/Library/LaunchAgents/it.airscript.krabb.plist" ;;
                *) exit 1 ;;
              esac

              test -f "$service"
              rm -f "$service"
            else
              [[ -f "$package/krabb-plugin.toml" ]]
              plugin=${name#krabb-}
              plugin=${plugin%-v*}
              binary="krabb-plugin-$plugin"
              [[ -x "$package/bin/$binary" ]]
            fi
          done

      - if: matrix.archive == 'tar.gz' && contains(format(' {0} ', inputs.names), ' core ')
        name: Validate Unix Installer
        shell: bash

        run: |
          set -euo pipefail
          version=$(bash krabb-scripts/version.sh)
          prefix="$RUNNER_TEMP/krabb-prefix"

          KRABB_RELEASE_BASE="file://$PWD" \
            KRABB_PREFIX="$prefix" \
            sh install.sh
          test "$("$prefix/bin/krabb" version)" = "krabb $version"

      - if: matrix.archive == 'zip'
        name: Validate Windows Archives
        shell: pwsh

        env:
          KRABB_NAMES: ${{ inputs.names }}
          KRABB_TARGET: ${{ matrix.target }}

        run: |
          $ErrorActionPreference = "Stop"
          $names = @($env:KRABB_NAMES -split '\s+' | Where-Object { $_ })
          $archives = @(Get-ChildItem "krabb-*-$env:KRABB_TARGET.zip")
          if ($archives.Count -ne $names.Count) { throw "Expected $($names.Count) archives, found $($archives.Count)." }

          foreach ($archive in $archives) {
            $destination = Join-Path $env:RUNNER_TEMP $archive.BaseName
            Expand-Archive -Path $archive.FullName -DestinationPath $destination -Force
            $package = Join-Path $destination $archive.BaseName

            if (!(Test-Path "$package/LICENSE") -or !(Test-Path "$package/NOTICE")) {
              throw "Archive is missing license files: $($archive.Name)."
            }

            if (!(Test-Path "$package/bin")) { throw "Archive is missing binaries: $($archive.Name)." }

            if ($archive.BaseName -like "krabb-core-*") {
              if (!(Test-Path "$package/bin/krabb.exe") -or !(Test-Path "$package/bin/krabb-daemon.exe")) {
                throw "Core archive is missing an executable."
              }
              & "$package/bin/krabb.exe" version
              if ($LASTEXITCODE -ne 0) { throw "Packaged CLI failed to start." }
            } else {
              if (!(Test-Path "$package/krabb-plugin.toml")) { throw "Plugin manifest is missing." }
              $plugin = $archive.BaseName -replace "^krabb-", "" -replace "-v.*$", ""
              $binary = "krabb-plugin-$plugin.exe"
              if (!(Test-Path "$package/bin/$binary")) { throw "Plugin executable is missing." }
            }
          }

      - if: matrix.archive == 'zip' && contains(format(' {0} ', inputs.names), ' core ')
        name: Validate Windows Installer
        shell: pwsh

        run: |
          $ErrorActionPreference = "Stop"
          $version = bash krabb-scripts/version.sh
          if ($LASTEXITCODE -ne 0 -or -not $version) { throw "Cargo.toml has no workspace version." }

          $env:KRABB_RELEASE_BASE = ([Uri]((Get-Location).Path)).AbsoluteUri.TrimEnd('/')
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "krabb-local"
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          & "$env:GITHUB_WORKSPACE/install.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Packaged installer failed." }
          $reported = & "$env:LOCALAPPDATA/Krabb/bin/krabb.exe" version
          if ($LASTEXITCODE -ne 0) { throw "Installed CLI failed to start." }
          if ($reported -ne "krabb $version") { throw "Installed CLI reports '$reported'." }

      - if: matrix.archive == 'zip' && contains(format(' {0} ', inputs.names), ' core ')
        name: Validate Windows Service
        shell: pwsh

        run: |
          $ErrorActionPreference = "Stop"
          $krabb = Join-Path $env:RUNNER_TEMP "krabb-local/Krabb/bin/krabb.exe"
          $user = Join-Path $env:RUNNER_TEMP "krabb-service-user"
          if (!(Test-Path $krabb)) { throw "The installed CLI is missing at $krabb." }

          New-Item -ItemType Directory -Force -Path (Join-Path $user ".krabb") | Out-Null
          $env:USERPROFILE = $user
          $env:HOME = $user
          $env:KRABB_HOME = Join-Path $user ".krabb"

          function Invoke-Krabb {
            $output = & $krabb @args
            if ($LASTEXITCODE -ne 0) { throw "krabb $args failed: $output" }
            return ($output | Out-String | ConvertFrom-Json)
          }

          $installed = Invoke-Krabb --json service install

          try {
            if ($installed.status -ne "installed") { throw "Service install reported '$($installed.status)'." }
            if (!(Test-Path $installed.path)) { throw "Service definition is missing at $($installed.path)." }

            $status = Invoke-Krabb --json service status
            if ($status.status -ne "installed") { throw "Service status reported '$($status.status)'." }
            if (!(Get-Service -Name $status.name -ErrorAction SilentlyContinue)) {
              throw "Windows has no $($status.name) service."
            }
          } finally {
            & $krabb service uninstall --yes
            if ($LASTEXITCODE -ne 0) { throw "krabb service uninstall failed." }
          }

          if (Test-Path $installed.path) { throw "Service definition remains at $($installed.path)." }
          if (Get-Service -Name Krabb -ErrorAction SilentlyContinue) { throw "Windows still has the Krabb service." }

      - name: Upload Archives
        uses: actions/upload-artifact@v7

        with:
          name: ${{ inputs.artifact }}-${{ matrix.target }}
          path: |
            krabb-*-${{ matrix.target }}.${{ matrix.archive }}
            SHA256SUMS
          if-no-files-found: error
