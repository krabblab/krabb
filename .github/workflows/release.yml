name: Release

# Publishes what the head of main declares once CI passes for it: Krabb at its workspace
# version, and each plugin at the version in its manifest. Versions that are already
# published are skipped with a notice, and a run with nothing new ends after Plan.
#
# Plan decides what to build, Build packages it once per target, the Install and Update
# drills test exactly those archives, and Publish pushes the plugins and then the Krabb
# release only when both drills pass. A dry run, with the publish option cleared, runs the
# same stages from any branch and publishes nothing.

on:
  workflow_run:
    workflows: [Main]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      krabb:
        description: "Release Krabb at its workspace version"
        type: boolean
        default: true

      plugins:
        description: "Release plugins at their manifest versions"
        type: boolean
        default: true

      publish:
        description: "Publish; clear it for a dry run from any branch that publishes nothing"
        type: boolean
        default: true

      rebuild:
        description: "Dry runs only: space-separated plugin IDs to build although published"
        type: string
        default: ""

permissions:
  contents: read

# Release runs take turns. Manual runs from main and passing CI runs for the head join the
# queue; each releases the whole head of main, so a newer run replacing a waiting one loses
# nothing. Dry runs never join it.
concurrency:
  group: >-
    ${{ ((github.event_name == 'workflow_dispatch' && inputs.publish &&
          github.ref == 'refs/heads/main') ||
         (github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event != 'pull_request' &&
          github.event.workflow_run.head_sha == github.sha)) &&
        'release' || format('release-skip-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:

  plan:
    name: Plan
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      packages: read

    outputs:
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      release: ${{ steps.plan.outputs.release }}
      plugins: ${{ steps.plan.outputs.plugins }}
      index: ${{ steps.plan.outputs.index }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

        with:
          persist-credentials: false

      - id: plan
        name: Plan The Release

        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          KRABB_CI_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
          KRABB_COMMIT: ${{ github.sha }}
          KRABB_EVENT: ${{ github.event_name }}
          KRABB_KRABB: ${{ github.event_name == 'workflow_run' || inputs.krabb }}
          KRABB_PLUGINS: ${{ github.event_name == 'workflow_run' || inputs.plugins }}
          KRABB_PUBLISH: ${{ github.event_name == 'workflow_run' || inputs.publish }}
          KRABB_REBUILD: ${{ inputs.rebuild }}
          KRABB_REF: ${{ github.ref }}
          KRABB_REGISTRY_TOKEN: ${{ github.token }}
          KRABB_REGISTRY_USER: ${{ github.actor }}

        run: bash krabb-scripts/plan.sh

      - if: steps.plan.outputs.release == 'true'
        name: Upload Release Notes
        uses: actions/upload-artifact@v7

        with:
          name: krabb-notes
          path: release-notes.md
          if-no-files-found: error

  # Krabb is built even when only plugins are new, because the drills install it.
  build:
    name: Build
    needs: plan
    if: needs.plan.outputs.build == 'true'
    uses: ./.github/workflows/package.yml

    with:
      names: core ${{ needs.plan.outputs.plugins }}
      artifact: krabb-release

  previous:
    name: Build Previous
    needs: plan
    if: needs.plan.outputs.build == 'true'
    uses: ./.github/workflows/package.yml

    with:
      names: core
      artifact: krabb-previous
      version: 0.0.0-previous

  # A release whose archives do not install and run on every target is never published.
  install:
    name: Install
    needs: build
    uses: ./.github/workflows/install.yml

    with:
      artifact: krabb-release
      targets: ${{ needs.build.outputs.targets }}

  # A release that cannot update an earlier build or roll back to it is never published.
  update:
    name: Update
    needs: [build, previous]
    uses: ./.github/workflows/update.yml

    with:
      artifact: krabb-release
      previous: krabb-previous
      targets: ${{ needs.build.outputs.targets }}

  # The index is rebuilt after each publication, and on its own when Plan found it stale.
  plugins:
    name: Publish Plugins
    needs: [plan, install, update]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' &&
          needs.plan.outputs.publish == 'true' &&
          (needs.plan.outputs.plugins != '' || needs.plan.outputs.index == 'true') &&
          (needs.plan.outputs.build != 'true' ||
           (needs.install.result == 'success' && needs.update.result == 'success')) }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

        with:
          persist-credentials: false

      - if: needs.plan.outputs.plugins != ''
        name: Download Archives
        uses: actions/download-artifact@v8

        with:
          pattern: krabb-release-*
          path: dist
          merge-multiple: true

      - name: Install ORAS
        uses: oras-project/setup-oras@v2

      - name: Sign In To The Registry
        env:
          GITHUB_TOKEN: ${{ github.token }}

        run: printf '%s' "$GITHUB_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Publish Plugins And The Index
        env:
          KRABB_REGISTRY_TOKEN: ${{ github.token }}
          KRABB_REGISTRY_USER: ${{ github.actor }}

        run: |
          set -euo pipefail
          mkdir -p dist
          python3 krabb-scripts/plugins.py publish dist \
            "ghcr.io/${GITHUB_REPOSITORY,,}/plugins" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"

  krabb:
    name: Publish Krabb
    needs: [plan, install, update, plugins]
    if: >-
      ${{ !cancelled() && needs.plan.outputs.publish == 'true' &&
          needs.plan.outputs.release == 'true' && needs.install.result == 'success' &&
          needs.update.result == 'success' &&
          (needs.plugins.result == 'success' || needs.plugins.result == 'skipped') }}
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download Release Notes
        uses: actions/download-artifact@v8

        with:
          name: krabb-notes
          path: notes

      - name: Download Archives
        uses: actions/download-artifact@v8

        with:
          pattern: krabb-release-*
          path: dist

      # Each target's build wrote its line of SHA256SUMS, which the drills installed against.
      - name: Collect The Release
        env:
          KRABB_VERSION: ${{ needs.plan.outputs.version }}

        run: |
          set -euo pipefail
          mkdir release
          cp dist/*/krabb-core-v"$KRABB_VERSION"-* release/
          cat dist/*/SHA256SUMS | sort -k 2 > release/SHA256SUMS
          test "$(find release -name 'krabb-core-*' | wc -l)" -eq 6
          test "$(wc -l < release/SHA256SUMS)" -eq 6
          (cd release && sha256sum --check --strict SHA256SUMS)

      # The release stays a draft until every file is attached, so installers that read the
      # latest release never see it half uploaded.
      - name: Publish GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          KRABB_PRERELEASE: ${{ needs.plan.outputs.prerelease }}
          KRABB_VERSION: ${{ needs.plan.outputs.version }}

        run: |
          set -euo pipefail
          tag="v$KRABB_VERSION"
          options=(--title "$tag" --notes-file notes/release-notes.md)
          [[ "$KRABB_PRERELEASE" == true ]] && options+=(--prerelease)

          if answer=$(gh api "repos/$GH_REPO/releases/tags/$tag" --silent 2>&1); then
            echo "::notice title=Krabb release skipped::Krabb $KRABB_VERSION is already" \
              "released, so this run publishes nothing."
            exit 0
          elif [[ "$answer" != *"HTTP 404"* ]]; then
            echo "$answer" >&2
            exit 1
          fi

          # A draft left by a failed run may point at an older commit, so it is replaced.
          if [[ "$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)" == true ]]; then
            gh release delete "$tag" --yes
          fi

          # Installers download the latest release, so it stays on the newest stable version
          # even when an older one is published afterwards.
          latest=false

          if [[ "$KRABB_PRERELEASE" != true ]]; then
            published=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1000 \
              --json tagName --jq '.[].tagName')

            newest=$(printf '%s\n' "$published" "$tag" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
              sort -V | tail -n 1)

            [[ "$newest" != "$tag" ]] || latest=true
          fi

          gh release create "$tag" release/* --draft --target "$GITHUB_SHA" "${options[@]}"
          gh release edit "$tag" --draft=false --latest="$latest"
