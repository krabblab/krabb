name: Release

# Publishes what the head of main declares once CI passes for it: Krabb at its workspace
# version, and each plugin at the version in its manifest. Versions that are already
# published are skipped with a notice.

on:
  workflow_run:
    workflows: [Main]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      krabb:
        description: "Release Krabb at its workspace version"
        type: boolean
        default: true

      plugins:
        description: "Release plugins at their manifest versions"
        type: boolean
        default: true

permissions:
  contents: read

# Release runs take turns. Manual runs from main and passing CI runs for the head join the
# queue; each releases the whole head of main, so a newer run replacing a waiting one loses
# nothing.
concurrency:
  group: >-
    ${{ ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
         (github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event != 'pull_request' &&
          github.event.workflow_run.head_sha == github.sha)) &&
        'release' || format('release-skip-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:

  # Releases only the current head of main, once CI has passed for it. Each release covers
  # every earlier commit, so CI for a commit that is no longer the head releases nothing.
  gate:
    name: Gate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read

    outputs:
      release: ${{ steps.gate.outputs.release }}

    steps:
      - id: gate
        name: Confirm CI Passed For The Head Of Main

        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          KRABB_CI_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
          KRABB_COMMIT: ${{ github.sha }}
          KRABB_EVENT: ${{ github.event_name }}
          KRABB_REF: ${{ github.ref }}

        run: |
          set -euo pipefail
          refuse() { echo "::error title=Release refused::$*"; exit 1; }
          skip() {
            echo "::notice title=Release skipped::$*"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [[ "$KRABB_EVENT" == workflow_dispatch && "$KRABB_REF" != refs/heads/main ]]; then
            refuse "Run the Release workflow from main."
          fi

          head=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          short=${KRABB_CI_COMMIT:0:7}

          if [[ "$KRABB_EVENT" == workflow_dispatch && "$KRABB_COMMIT" != "$head" ]]; then
            refuse "Main moved past $short while this run was queued; run it again."
          fi

          if [[ "$KRABB_CI_COMMIT" != "$head" || "$KRABB_COMMIT" != "$head" ]]; then
            skip "Main has moved past $short, so this run releases nothing;" \
              "CI for the newer commit releases it."
          fi

          if [[ "$KRABB_EVENT" == workflow_dispatch ]]; then
            passed=$(gh run list --workflow main.yml --branch main --commit "$head" \
              --status success --limit 100 --json event \
              --jq '[.[] | select(.event != "pull_request")] | length')

            [[ "$passed" != 0 ]] ||
              refuse "The latest CI run for $short, the head of main, has not passed."
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"

  prepare:
    name: Prepare
    needs: gate
    if: >-
      needs.gate.outputs.release == 'true' &&
      (github.event_name == 'workflow_run' || inputs.krabb)
    uses: ./.github/workflows/prepare.yml

  plan:
    name: Plan Plugins
    needs: gate
    if: >-
      needs.gate.outputs.release == 'true' &&
      (github.event_name == 'workflow_run' || inputs.plugins)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    outputs:
      names: ${{ steps.plan.outputs.names }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

        with:
          persist-credentials: false

      - id: plan
        name: Find Unpublished Versions

        env:
          KRABB_REGISTRY_TOKEN: ${{ github.token }}
          KRABB_REGISTRY_USER: ${{ github.actor }}

        run: |
          set -euo pipefail
          names=$(python3 krabb-scripts/plugins.py plan "ghcr.io/${GITHUB_REPOSITORY,,}/plugins")
          echo "names=$names" >> "$GITHUB_OUTPUT"

          if [[ -z "$names" ]]; then
            echo "::notice title=Plugin release skipped::Every plugin version is already" \
              "published, so this run releases no plugin."
          else
            echo "Unpublished plugins: $names."
          fi

  package:
    name: Package
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    uses: ./.github/workflows/package.yml

    with:
      names: core
      artifact: krabb-v${{ needs.prepare.outputs.version }}

  checksum:
    name: Checksum
    needs: [prepare, package]
    uses: ./.github/workflows/checksum.yml

    with:
      version: ${{ needs.prepare.outputs.version }}

  publish:
    name: Publish
    needs: [prepare, checksum]
    uses: ./.github/workflows/publish.yml

    permissions:
      contents: write

    with:
      version: ${{ needs.prepare.outputs.version }}
      prerelease: ${{ needs.prepare.outputs.prerelease }}

  plugins:
    name: Plugins
    needs: plan
    uses: ./.github/workflows/plugins.yml

    permissions:
      contents: read
      packages: write

    with:
      names: ${{ needs.plan.outputs.names }}
