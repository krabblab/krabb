name: Release

# Publishes what the code declares: Krabb at its workspace version, and each plugin at the
# version in its manifest. Versions that are already published are skipped with a warning.

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      krabb:
        description: "Release Krabb at its workspace version"
        type: boolean
        default: true

      plugins:
        description: "Release plugins at their manifest versions"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:

  prepare:
    name: Prepare
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.krabb)
    uses: ./.github/workflows/prepare.yml

  plan:
    name: Plan Plugins
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.plugins)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    outputs:
      names: ${{ steps.plan.outputs.names }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

        with:
          persist-credentials: false

      - id: plan
        name: Find Unpublished Versions

        env:
          KRABB_REGISTRY_TOKEN: ${{ github.token }}
          KRABB_REGISTRY_USER: ${{ github.actor }}

        run: |
          set -euo pipefail
          names=$(python3 krabb-scripts/plugins.py plan "ghcr.io/${GITHUB_REPOSITORY,,}/plugins")
          echo "names=$names" >> "$GITHUB_OUTPUT"

          if [[ -z "$names" ]]; then
            echo "::warning title=Plugin release skipped::Every plugin version is already published, so this run releases no plugin."
          else
            echo "Unpublished plugins: $names."
          fi

  verify:
    name: Verify
    needs: [prepare, plan]
    if: >-
      !cancelled() && needs.prepare.result != 'failure' && needs.plan.result != 'failure' &&
      (needs.prepare.outputs.release == 'true' || needs.plan.outputs.names != '')
    uses: ./.github/workflows/verify.yml

  package:
    name: Package
    needs: [prepare, verify]
    if: needs.prepare.outputs.release == 'true'
    uses: ./.github/workflows/package.yml

    with:
      names: core
      artifact: krabb-v${{ needs.prepare.outputs.version }}

  checksum:
    name: Checksum
    needs: [prepare, package]
    uses: ./.github/workflows/checksum.yml

    with:
      version: ${{ needs.prepare.outputs.version }}

  publish:
    name: Publish
    needs: [prepare, checksum]
    uses: ./.github/workflows/publish.yml

    permissions:
      contents: write

    with:
      version: ${{ needs.prepare.outputs.version }}
      prerelease: ${{ needs.prepare.outputs.prerelease }}

  plugins:
    name: Plugins
    needs: [plan, verify]
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      (needs.verify.result == 'success' ||
       (needs.verify.result == 'skipped' && needs.plan.outputs.names == ''))
    uses: ./.github/workflows/plugins.yml

    permissions:
      contents: read
      packages: write

    with:
      names: ${{ needs.plan.outputs.names }}
