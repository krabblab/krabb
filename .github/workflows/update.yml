name: Update
run-name: >-
  ${{ format('test(update): drill updates on {0}', github.ref_name) }}

# Proves `krabb update` and `krabb update --rollback` on real archives on every target. It
# installs a previous build, which is the candidate's own source packaged at version
# 0.0.0-previous, sets up official plugins and the service, then updates from local release
# directories laid out as `KRABB_RELEASE_BASE` expects. A copy of the candidate whose daemon
# exits at once must fail activation and restore the previous build; the real candidate must
# update; and the recovery point's binary must roll back while the new daemon cannot start.
# Release runs it on the archives it is about to publish, so a release that cannot update or
# roll back is never published. Plugin archives in the candidate's release directory are
# installed from a local index. The steps live in krabb-scripts/drills.

on:
  workflow_dispatch:

  schedule:
    - cron: "23 6 * * 1"

  workflow_call:
    inputs:
      artifact:
        description: "Prefix of release directories already packaged in this run"
        required: true
        type: string

      previous:
        description: "Prefix of the previous build's release directories in this run"
        required: true
        type: string

      targets:
        description: "The release targets as a JSON array"
        required: true
        type: string

permissions:
  contents: read

env:
  KRABB_PREVIOUS: 0.0.0-previous

jobs:
  candidate:
    name: Candidate
    if: inputs.artifact == ''
    uses: ./.github/workflows/package.yml

    with:
      names: core
      artifact: krabb-update-candidate

  previous:
    name: Previous
    if: inputs.previous == ''
    uses: ./.github/workflows/package.yml

    with:
      names: core
      artifact: krabb-update-previous
      version: 0.0.0-previous

  drill:
    name: Drill (${{ matrix.name }})
    needs: [candidate, previous]
    if: >-
      ${{ !cancelled() && needs.previous.result != 'failure' &&
          needs.candidate.result != 'failure' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    strategy:
      fail-fast: false

      matrix:
        include: ${{ fromJSON(inputs.targets || needs.previous.outputs.targets) }}

    defaults:
      run:
        shell: ${{ matrix.os == 'windows' && 'pwsh' || 'bash' }}

    env:
      KRABB_ARCHIVE: ${{ matrix.archive }}
      KRABB_TARGET: ${{ matrix.target }}

      KRABB_DRILL: >-
        ${{ matrix.os == 'windows' && './krabb-scripts/drills/drill.ps1' ||
            'bash krabb-scripts/drills/drill.sh' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

        with:
          persist-credentials: false

      - name: Download Previous Release
        uses: actions/download-artifact@v8

        with:
          name: ${{ inputs.previous || 'krabb-update-previous' }}-${{ matrix.target }}
          path: ${{ runner.temp }}/previous

      - name: Download Candidate Release
        uses: actions/download-artifact@v8

        with:
          name: ${{ inputs.artifact || 'krabb-update-candidate' }}-${{ matrix.target }}
          path: ${{ runner.temp }}/candidate

      - name: Serve The Releases And Their Plugins
        shell: bash
        run: bash krabb-scripts/drills/drill.sh update-serve

      - name: Build A Candidate Whose Daemon Cannot Start
        run: ${{ env.KRABB_DRILL }} broken

      - name: Isolate Home
        run: ${{ env.KRABB_DRILL }} update-home

      - name: Install The Previous Build
        run: ${{ env.KRABB_DRILL }} previous

      - name: Set Up Plugins And The Service
        run: ${{ env.KRABB_DRILL }} setup

      - name: Restore The Previous Build After A Failed Activation
        run: ${{ env.KRABB_DRILL }} restore

      - name: Update To The Candidate
        run: ${{ env.KRABB_DRILL }} update

      - name: Roll Back While The New Daemon Cannot Start
        run: ${{ env.KRABB_DRILL }} rollback

      - if: always()
        name: Remove The Service
        run: ${{ env.KRABB_DRILL }} remove
