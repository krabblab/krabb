name: Main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # Pull requests test only the packages they can affect; main and manual runs test all.
  changes:
    name: Changes
    runs-on: ubuntu-latest

    outputs:
      code: ${{ steps.changes.outputs.code }}
      packages: ${{ steps.changes.outputs.packages }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

        with:
          fetch-depth: 2
          persist-credentials: false

      - id: changes
        name: Select Packages
        run: python3 -B krabb-scripts/changes.py ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}

  check:
    name: Check
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/check.yml

  agentskill:
    name: Agentskill
    uses: ./.github/workflows/agentskill.yml

  security:
    name: Security
    uses: ./.github/workflows/security.yml

  test:
    name: Test
    needs: [changes, check]
    uses: ./.github/workflows/test.yml

    with:
      packages: ${{ needs.changes.outputs.packages }}

  build:
    name: Build
    needs: test
    uses: ./.github/workflows/build.yml

  integration:
    name: Integration
    needs: [changes, test]
    uses: ./.github/workflows/integration.yml

    with:
      packages: ${{ needs.changes.outputs.packages }}
