name: Publish

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

      prerelease:
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Download Release Notes
        uses: actions/download-artifact@v8

        with:
          name: krabb-release-notes-${{ inputs.version }}
          path: notes

      - name: Download Archives
        uses: actions/download-artifact@v8

        with:
          pattern: krabb-v${{ inputs.version }}-*
          path: dist
          merge-multiple: true

      # The release stays a draft until every file is attached, so installers that read the
      # latest release never see it half uploaded.
      - name: Publish GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          KRABB_PRERELEASE: ${{ inputs.prerelease }}
          KRABB_VERSION: ${{ inputs.version }}

        run: |
          set -euo pipefail
          tag="v$KRABB_VERSION"
          options=(--title "$tag" --notes-file notes/release-notes.md)
          [[ "$KRABB_PRERELEASE" == true ]] && options+=(--prerelease)

          # A draft left by a failed run may point at an older commit, so it is replaced.
          if [[ "$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)" == true ]]; then
            gh release delete "$tag" --yes
          fi

          gh release create "$tag" dist/* --draft --target "$GITHUB_SHA" "${options[@]}"
          gh release edit "$tag" --draft=false
