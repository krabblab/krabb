name: Prepare

on:
  workflow_call:
    outputs:
      version:
        value: ${{ jobs.release.outputs.version }}

      prerelease:
        value: ${{ jobs.release.outputs.prerelease }}

      release:
        value: ${{ jobs.release.outputs.release }}

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      release: ${{ steps.release.outputs.release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

        with:
          persist-credentials: false

      - id: release
        name: Find The Release

        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          set -euo pipefail
          notes=$(bash krabb-scripts/notes.sh release-notes.md)
          read -r version prerelease <<< "$notes"
          release=true

          if answer=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$version" --silent 2>&1); then
            release=false
            echo "::notice title=Krabb release skipped::Krabb $version is already released, so this run publishes no new Krabb release."
          elif [[ "$answer" != *"HTTP 404"* ]]; then
            echo "$answer" >&2
            exit 1
          fi

          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

      - name: Upload Release Notes
        if: steps.release.outputs.release == 'true'
        uses: actions/upload-artifact@v7

        with:
          name: krabb-release-notes-${{ steps.release.outputs.version }}
          path: release-notes.md
          if-no-files-found: error
