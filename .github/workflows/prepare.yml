name: Prepare

on:
  workflow_call:
    outputs:
      tag:
        value: ${{ jobs.release.outputs.tag }}

      version:
        value: ${{ jobs.release.outputs.version }}

      prerelease:
        value: ${{ jobs.release.outputs.prerelease }}

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    container: rust:1.89-trixie

    defaults:
      run:
        shell: bash

    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - id: release
        name: Validate Release Metadata

        env:
          KRABB_RELEASE_TAG: ${{ github.ref_name }}

        run: |
          set -euo pipefail
          tag="${KRABB_RELEASE_TAG#refs/tags/}"
          release=$(bash krabb-scripts/release.sh --notes "$tag" release-notes.md)
          read -r version prerelease <<< "$release"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Upload Release Notes
        uses: actions/upload-artifact@v7

        with:
          name: krabb-release-notes-${{ steps.release.outputs.version }}
          path: release-notes.md
          if-no-files-found: error
