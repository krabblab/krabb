name: Test

on:
  workflow_dispatch:
    inputs:
      local:
        description: "Use the local act working tree"
        required: false
        type: string
        default: ""

  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ""

      local:
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  krabb:
    name: Krabb (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: Windows x86_64
            os: windows
            arch: x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            coverage: false

          - name: Windows aarch64
            os: windows
            arch: aarch64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            coverage: false

    steps:
      - name: Checkout
        if: inputs.local != 'true'
        uses: actions/checkout@v7

        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Rust Toolchain
        if: inputs.local != 'true'
        uses: dtolnay/rust-toolchain@1.99

        with:
          components: llvm-tools-preview
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - if: matrix.coverage
        name: Install Coverage Tool
        uses: taiki-e/install-action@v2

        with:
          tool: cargo-llvm-cov

      - if: matrix.coverage
        name: Run Coverage
        shell: bash
        env:
          KRABB_COVERAGE_PACKAGE_MIN: ${{ matrix.coverage_package_min }}
          KRABB_COVERAGE_RUNTIME_MIN: ${{ matrix.coverage_runtime_min }}

        run: bash krabb-scripts/coverage.sh "${{ matrix.coverage_profile }}"

      - if: matrix.os == 'windows'
        name: Run Focused Windows Tests
        run: >-
          cargo test --locked -p krabb-plugin-tools --tests --target "${{ matrix.target }}" &&
          cargo test --locked -p krabb-plugin-memory --bin krabb-plugin-memory --target "${{ matrix.target }}" &&
          cargo test --locked -p krabb-runtime --lib --target "${{ matrix.target }}"

      - if: matrix.coverage == false && matrix.os != 'windows'
        name: Run Workspace Tests
        run: cargo test --workspace --no-fail-fast --locked --target "${{ matrix.target }}"

      - name: Check Unix Installer Inputs
        if: runner.os != 'Windows'
        shell: bash

        run: |
          sh install.sh --help
          if KRABB_VERSION=1.0.0 sh install.sh unsupported; then
            printf '%s\n' 'Installer accepted an unsupported plugin.' >&2
            exit 1
          fi

          if KRABB_VERSION=invalid sh install.sh; then
            printf '%s\n' 'Installer accepted an invalid version.' >&2
            exit 1
          fi

      - name: Check Windows Installer Inputs
        if: runner.os == 'Windows'
        shell: pwsh

        run: |
          .\install.ps1 --help
          pwsh -NoProfile -File .\install.ps1 unsupported
          if ($LASTEXITCODE -eq 0) { throw 'Installer accepted an unsupported plugin.' }
          $env:KRABB_VERSION = 'invalid'
          pwsh -NoProfile -File .\install.ps1
          if ($LASTEXITCODE -eq 0) { throw 'Installer accepted an invalid version.' }
          exit 0

  sandbox:
    name: Sandbox
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:

      - name: Checkout
        if: inputs.local != 'true'
        uses: actions/checkout@v7

        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Rust Toolchain
        if: inputs.local != 'true'
        uses: dtolnay/rust-toolchain@1.99

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build Tools Plugin
        run: cargo build --locked -p krabb-plugin-tools

      - name: Prepare Sandbox Image
        run: docker pull busybox:1.36.1

      - name: Run Sandbox Smoke Test

        env:
          KRABB_SANDBOX_RUNTIME: docker
          KRABB_SANDBOX_IMAGE: busybox:1.36.1

        run: krabb-scripts/sandbox.sh target/debug/krabb-plugin-tools
