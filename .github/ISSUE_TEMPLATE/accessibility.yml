name: Accessibility
description: Report something that is hard or impossible to use with assistive technology.
labels: ["accessibility"]
body:
  - type: markdown
    attributes:
      value: Use a concise, Title Case title that names the barrier. You do not need to share any disability, screenshots, or recordings.
  - type: textarea
    id: story
    attributes:
      label: User Story
      description: What you were trying to do.
      placeholder: As a <role>, I want <goal>, so that <benefit>.
    validations:
      required: true
  - type: textarea
    id: barrier
    attributes:
      label: Barrier
      description: What got in the way, and where (command, terminal interface, channel, or documentation).
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Optional details that help reproduce it, such as the terminal, operating system, or assistive technology you use.
    validations:
      required: false
