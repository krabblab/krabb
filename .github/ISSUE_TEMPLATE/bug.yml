name: Bug
description: Report a reproducible problem.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Use a concise, Title Case title that names the problem. Redact secrets and tokens.
  - type: textarea
    id: story
    attributes:
      label: User Story
      description: Who is affected and what they were trying to do.
      placeholder: As a <role>, I want <expected behavior>, so that <benefit>.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and Actual Behavior
      description: What should happen and what happens instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      value: |
        1. 
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Krabb Version and Operating System
      placeholder: krabb 0.1.0 on Ubuntu 26.04 (aarch64)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted Logs
      render: text
    validations:
      required: false
